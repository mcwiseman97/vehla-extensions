name: Research Dock Widget

on:
  pull_request:
    paths:
      - ".github/workflows/research-dock-widget.yml"
      - "extensions/research-dock-widget/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-dock-widget.yml"
      - "extensions/research-dock-widget/**"
      - "sdk/swift/**"

concurrency:
  group: research-dock-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, and validate Research
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test --package-path extensions/research-dock-widget

      - name: Build widget bundle
        run: zsh extensions/research-dock-widget/build.sh

      - name: Validate widget package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/research-dock-widget/dist/Research
